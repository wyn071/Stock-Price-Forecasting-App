<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stock Price Predictor</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: sans-serif;
        background: #f5f5f5;
        display: flex;
        justify-content: center;
        padding: 40px 20px;
      }

      .container {
        background: white;
        border-radius: 12px;
        padding: 40px;
        width: 100%;
        max-width: 900px;
        box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
      }

      h1 {
        font-size: 24px;
        margin-bottom: 8px;
        color: #111;
      }

      p.subtitle {
        color: #666;
        font-size: 14px;
        margin-bottom: 32px;
      }

      .input-row {
        display: flex;
        gap: 12px;
        margin-bottom: 32px;
      }

      input {
        flex: 1;
        padding: 12px 16px;
        font-size: 16px;
        border: 1px solid #ddd;
        border-radius: 8px;
        outline: none;
        text-transform: uppercase;
      }

      input:focus {
        border-color: #4f46e5;
      }

      button {
        padding: 12px 28px;
        background: #4f46e5;
        color: white;
        font-size: 16px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
      }

      button:hover {
        background: #4338ca;
      }
      button:disabled {
        background: #a5b4fc;
        cursor: not-allowed;
      }

      #status {
        font-size: 14px;
        color: #666;
        margin-bottom: 16px;
        min-height: 20px;
      }

      #error {
        color: #dc2626;
        font-size: 14px;
        margin-bottom: 16px;
        min-height: 20px;
      }

      #chart-container {
        display: none;
      }

      #chart-title {
        font-size: 16px;
        font-weight: 600;
        color: #111;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>Stock Price Predictor</h1>
      <p class="subtitle">
        Enter a stock ticker to see a 365-day price forecast powered by Facebook
        Prophet.
      </p>

      <div class="input-row">
        <input
          type="text"
          id="ticker"
          placeholder="e.g. GOOG, AAPL, TSLA"
          maxlength="10"
        />
        <button id="predictBtn" onclick="predict()">Predict</button>
      </div>

      <div id="error"></div>
      <div id="status"></div>

      <div id="chart-container">
        <div id="chart-title"></div>
        <canvas id="myChart"></canvas>
      </div>
    </div>

    <script>
      let chartInstance = null;

      async function predict() {
        const ticker = document.getElementById("ticker").value.trim();
        const btn = document.getElementById("predictBtn");
        const status = document.getElementById("status");
        const error = document.getElementById("error");
        const chartContainer = document.getElementById("chart-container");

        // Clear previous state
        error.textContent = "";
        status.textContent = "";
        chartContainer.style.display = "none";

        if (!ticker) {
          error.textContent = "Please enter a stock ticker.";
          return;
        }

        // Show loading state
        btn.disabled = true;
        btn.textContent = "Predicting...";
        status.textContent =
          "Fetching data and running Prophet model. This may take 20-30 seconds...";

        try {
          const response = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ticker }),
          });

          const data = await response.json();

          if (!response.ok) {
            error.textContent =
              data.error || "Something went wrong. Please try again.";
            return;
          }

          // Extract chart data
          const labels = data.forecast.map((d) => d.ds);
          const predicted = data.forecast.map(
            (d) => Math.round(d.yhat * 100) / 100,
          );
          const lower = data.forecast.map(
            (d) => Math.round(d.yhat_lower * 100) / 100,
          );
          const upper = data.forecast.map(
            (d) => Math.round(d.yhat_upper * 100) / 100,
          );

          // Destroy previous chart if exists
          if (chartInstance) chartInstance.destroy();

          document.getElementById("chart-title").textContent =
            `${data.ticker} — 365-Day Price Forecast`;

          chartInstance = new Chart(document.getElementById("myChart"), {
            type: "line",
            data: {
              labels,
              datasets: [
                {
                  label: "Predicted Price",
                  data: predicted,
                  borderColor: "#4f46e5",
                  borderWidth: 2,
                  pointRadius: 0,
                  tension: 0.3,
                },
                {
                  label: "Upper Bound",
                  data: upper,
                  borderColor: "transparent",
                  backgroundColor: "rgba(79, 70, 229, 0.1)",
                  pointRadius: 0,
                  fill: "+1",
                },
                {
                  label: "Lower Bound",
                  data: lower,
                  borderColor: "transparent",
                  backgroundColor: "rgba(79, 70, 229, 0.1)",
                  pointRadius: 0,
                  fill: false,
                },
              ],
            },
            options: {
              responsive: true,
              plugins: {
                legend: { display: true },
              },
              scales: {
                x: {
                  ticks: {
                    maxTicksLimit: 8,
                    maxRotation: 0,
                  },
                },
                y: {
                  ticks: {
                    callback: (value) => "$" + value.toLocaleString(),
                  },
                },
              },
            },
          });

          chartContainer.style.display = "block";
          status.textContent = "";
        } catch (err) {
          error.textContent =
            "Could not connect to the server. Make sure app.py is running.";
        } finally {
          btn.disabled = false;
          btn.textContent = "Predict";
        }
      }

      // Allow pressing Enter to trigger prediction
      document
        .getElementById("ticker")
        .addEventListener("keydown", function (e) {
          if (e.key === "Enter") predict();
        });
    </script>
  </body>
</html>
